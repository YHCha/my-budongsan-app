name: Archive full-region MOLIT transactions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: rolling refresh / full-backfill: finish all missing history once'
        type: choice
        options: [daily, full-backfill]
        default: daily
      batch_size:
        description: 'Full-backfill partitions per validated checkpoint'
        type: choice
        options: ['75', '50', '100']
        default: '75'
  schedule:
    - cron: '47 22 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/archive_transactions.py'
      - 'scripts/update_site_transactions.py'
      - 'tests/test_archive_transactions.py'
      - '.github/workflows/archive-transactions.yml'

permissions:
  contents: write

concurrency:
  group: molit-full-region-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-backfill' && 360 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Load previous archive, fail closed on remote errors
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code origin refs/heads/transaction-archive > "$RUNNER_TEMP/archive-ref"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            expected=$(cut -f1 "$RUNNER_TEMP/archive-ref")
            git fetch origin "$expected"
            git worktree add --detach "$RUNNER_TEMP/molit-archive" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            expected=''
            git worktree add --detach "$RUNNER_TEMP/molit-archive" HEAD
          else
            exit "$status"
          fi
          echo "ARCHIVE_EXPECTED=$expected" >> "$GITHUB_ENV"
      - name: Collect and verify all region records
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-backfill' }}
          BATCH_SIZE: ${{ inputs.batch_size || '75' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--archive-dir "$RUNNER_TEMP/molit-archive/archive")
          if [ "$FULL_BACKFILL" = 'true' ]; then
            git -C "$RUNNER_TEMP/molit-archive" config user.name 'github-actions[bot]'
            git -C "$RUNNER_TEMP/molit-archive" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            args+=(--full-backfill --batch-size "$BATCH_SIZE" --publish-checkpoints)
          fi
          python scripts/archive_transactions.py "${args[@]}"
      - name: Publish bounded archive snapshot with lease
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'full-backfill') }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/molit-archive"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan archive-next
          git read-tree --empty
          git add -f -- archive
          git commit -m 'Publish validated full-region snapshot'
          git push --force-with-lease="refs/heads/transaction-archive:$ARCHIVE_EXPECTED" origin HEAD:refs/heads/transaction-archive
