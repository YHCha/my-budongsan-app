name: One-time start full backfill 20261031
on:
  push:
    branches: [main]
    paths: ['.github/workflows/start-full-backfill-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start requested full backfill once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run archive-transactions.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=full-backfill -f batch_size=75
