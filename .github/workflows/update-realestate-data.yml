name: Update MOLIT Apartment Data

on:
  workflow_dispatch:
  schedule:
    # Every day at 07:17 Asia/Seoul (22:17 UTC the previous day).
    - cron: '17 22 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-realestate-data.yml'
      - 'scripts/update_site_transactions.py'
      - 'tests/test_site_transactions.py'
      - 'site-data/seed-market.json.gz'
      - 'site-data/seed-transactions.csv.gz'

permissions:
  contents: write

concurrency:
  group: molit-site-transactions
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full-month replacement and cancellations
        run: python -m unittest discover -s tests -v
      - name: Collect district-months from 2025 and build atomic Site bundle
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python scripts/update_site_transactions.py
      - name: Commit only a fully validated successful collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-data/latest.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'Update validated Site transaction bundle'
            git push
          fi
